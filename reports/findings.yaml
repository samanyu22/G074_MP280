# MP280 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G074"          # your group id, e.g. "G042"
problem_id: "MP280"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of depot_zone whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "passengers"
    value: -1            # the special number typed instead of a blank
    count: 66            # how many rows have it
  duplicate_rows:
    present: true
    count: 39            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "driver_exp_yr"
    start_date: "2026-04-03"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-23"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 13            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "weather"
    true_levels: 3      # how many real categories there are after cleaning

tracking:
  experiment_name: "MP280_City_Bus_Delay"
  best_run_id: "6dc277849fe84543bdd9c60ac4815b54"
  registered_model_name: "mp280_bus_delay"
  champion_version: 1
  
monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    route_km: null
    stops: null
    passengers: null
    hour: null
    temp_c: null
    driver_exp_yr: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of depot_zone
    'North': null
    'South': null
    'East': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
